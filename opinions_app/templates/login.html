<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Log in/Sign up screen animation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='log.css') }}">
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,700' rel='stylesheet' type='text/css'>
</head>

<body>
<div class="container">
  <div class="frame">
    <div class="nav">
      <ul class="links">
        <li class="signin-active"><a class="btn">Войти</a></li>
        <li class="signup-inactive"><a class="btn">Регистрация </a></li>
      </ul>
    </div>
    <div ng-app ng-init="checked = false">
      <form class="form-signin" id="loginForm">
        <label for="username">Имя</label>
        <input class="form-styling" type="text" name="username" placeholder="Enter your username" required/>
        <label for="password">Пароль</label>
        <input class="form-styling" type="password" name="password" placeholder="Enter your password" required/>
        <input type="checkbox" id="checkbox"/>
        <label for="checkbox"><span class="ui"></span></label>
        <div class="btn-animate">
          <button type="submit" class="btn-signin">Войти</button>
          <a class="back-button" href="{{ url_for('index_view') }}">&#x2190;</a> 
        </div>
      </form>
      <form class="form-signup" id="registration-form" method="post" name="form">
        <label for="fullname">Имя</label>
        <input class="form-styling" type="text" name="fullname" placeholder="Enter your full name" required/>
        
        <label for="email">Email</label>
        <input class="form-styling" type="email" name="email" placeholder="Enter your email" required/>
        
        <label for="password">Пароль</label>
        <input class="form-styling" type="password" name="password" placeholder="Enter your password" required/>
        
        <label for="confirmpassword">Подтвердить пароль</label>
        <input class="form-styling" type="password" name="confirmpassword" placeholder="Confirm your password" required/>
        
        <button type="submit" class="btn-signup">Регистрация</button>
        <div id="message" style="color: rgb(17, 250, 24);"></div>
      
      </form>
      
      <div class="success">
        <svg width="270" height="270" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
             viewBox="0 0 60 60" id="check" ng-class="checked ? 'checked' : ''">
          <path fill="#ffffff" d="..."/>
        </svg>
        <div class="successtext">
          <p> Данные введены неверно, попробуйте еще раз.</p>
        </div>
      </div>
    </div>
      
      <div class="forgot">
        <a href="#"></a>
      </div>
      
      <div>
        <div class="cover-photo"></div>
        <div class="profile-photo"></div>
        <h1 class="welcome">Попробуйте еще раз.</h1>
        <a class="btn-goback" value="Refresh" onClick="history.go()">Go back</a>
      </div>
  </div>
    
  <a id="refresh" value="Refresh" onClick="history.go()">
    <svg class="refreshicon"   version="1.1" id="Capa_1"  xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
         width="25px" height="25px" viewBox="0 0 322.447 322.447" style="enable-background:new 0 0 322.447 322.447;"
         xml:space="preserve">
         <path  d="M321.832,230.327c-2.133-6.565-9.184-10.154-15.75-8.025l-16.254,5.281C299.785,206.991,305,184.347,305,161.224
                c0-84.089-68.41-152.5-152.5-152.5C68.411,8.724,0,77.135,0,161.224s68.411,152.5,152.5,152.5c6.903,0,12.5-5.597,12.5-12.5
                c0-6.902-5.597-12.5-12.5-12.5c-70.304,0-127.5-57.195-127.5-127.5c0-70.304,57.196-127.5,127.5-127.5
                c70.305,0,127.5,57.196,127.5,127.5c0,19.372-4.371,38.337-12.723,55.568l-5.553-17.096c-2.133-6.564-9.186-10.156-15.75-8.025
                c-6.566,2.134-10.16,9.186-8.027,15.751l14.74,45.368c1.715,5.283,6.615,8.642,11.885,8.642c1.279,0,2.582-0.198,3.865-0.614
                l45.369-14.738C320.371,243.946,323.965,236.895,321.832,230.327z"/>
    </svg>
  </a>
</div>
  <script src='http://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
<script src='http://cdnjs.cloudflare.com/ajax/libs/angular.js/1.3.14/angular.min.js'></script>

    <script src="static/log.js"></script>
    <script>
      document.getElementById('loginForm').onsubmit = async function(e) {
        e.preventDefault();
  
        const formData = new FormData(this);
        const response = await fetch('/api/login', {
              method: 'POST',
              body: JSON.stringify({
                  username: formData.get('username'),
                  password: formData.get('password')
              }),
              headers: {
                  'Content-Type': 'application/json'
              }
        });
        
        const data = await response.json();
        if (data.message) {
            alert(data.message);
        } 
        if (response.ok) {
          window.location.href = '/me';
        } else {
            console.error('Ошибка логина:', data.message);
        }
      };
    </script>
    <script>
        document.getElementById('registration-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            });

            const result = await response.json();

            const messageContainer = document.getElementById('message');
            if (response.ok) {
                messageContainer.style.color = 'green';
                messageContainer.innerText = result.message;
                // Перенаправление на страницу после успешной регистрации
                window.location.href = '/register';
            } else {
                messageContainer.style.color = 'red';
                messageContainer.innerText = result.message || 'Произошла непредвиденная ошибка';
                // Отображение сообщения об ошибке под формой
                const successTextContainer = document.querySelector('.successtext');
                successTextContainer.innerText = result.message || 'Данные введены неверно, попробуйте еще раз.';
                successTextContainer.style.display = 'block'; // Убедитесь, что контейнер видим
            }
        };

</script>
</body>
</html>

{% extends "base.html" %}

{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='stylebook.css') }}"> 
    <title>Запись на тренировки</title>
    <script>
        const currentUserId = {{ current_user.id if current_user.is_authenticated else 'null' | tojson }};
    
        async function bookWorkout(workoutId) {
            if (currentUserId === null) {
                alert('Вы должны быть авторизованы, чтобы записаться на тренировку.');
                return;
            }
            
            try {
                const response = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ workout_id: workoutId })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result);
                }

                // Обновляем сообщение о записи на тренировку
                document.getElementById('bookingMessage').innerText = 'Вы успешно записаны';
            } catch (error) {
                document.getElementById('bookingMessage').innerText = error.message;
            }
        }

        async function fetchWorkouts() {
            try {
                const response = await fetch('/api/workouts');
                if (!response.ok) {
                    throw new Error('Не удалось загрузить тренировки');
                }
                const workouts = await response.json();
                populateWorkoutTable(workouts);
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }

        function populateWorkoutTable(workouts) {
            const tableBody = document.querySelector('#workoutTableBody');
            tableBody.innerHTML = '';
            workouts.forEach(workout => {
                const row = document.createElement('tr');
                const date = new Date(workout.date).toISOString().split('T')[0];
                const time = workout.time;

                row.innerHTML = `
                    <td>${workout.day_of_week}</td> <!-- Используем уже сериализованное значение -->
                    <td>${date}</td>
                    <td>${time}</td>
                    <td>${workout.exercise_type}</td> <!-- Используем уже сериализованное значение -->
                    <td>${workout.coach}</td> <!-- Используем уже сериализованное значение -->
                    <td>
                        <button onclick="bookWorkout(${workout.id})" class="btn btn-primary">Записаться</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        document.addEventListener('DOMContentLoaded', fetchWorkouts);
    </script>
</head>
<body>
    <div class="background-image"></div>
    <div class="container">
            <div class="training-table">
                <h2>Расписание тренировок</h2>
                <table>
                    <thead>
                        <tr>
                            <th>День недели</th>
                            <th>Дата</th>
                            <th>Время</th>
                            <th>Вид занятия</th>
                            <th>Тренер</th>
                            <th>Записаться</th>
                        </tr>
                    </thead>
                    <tbody id="workoutTableBody">
                    </tbody>
                </table>
                <div id="bookingMessage" style="color: rgb(255, 255, 255); margin-top: 10px; text-align: center;"></div>
            </div>
        </div>
    </div>
</body>
{% include "footer.html" %}
{% endblock %}

{% extends "base.html" %}

{% block content %}
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='my_teacher.css') }}">
    <title>Тренеры</title>
</head>
<body>
    <div class="coaches-container">
        <h1>Наши Тренеры</h1>
        <div class="coaches-list" id="coachesList">
        </div>
    </div>

    <script>
        const staticUrl = "{{ static_url }}";

        async function fetchCoaches() {
            try {
                const response = await fetch('/api/coaches');
                if (!response.ok) {
                    throw new Error('Не удалось загрузить тренеров');
                }
                const coaches = await response.json();
                populateCoachesList(coaches);
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }
        function populateCoachesList(coaches) {
            const coachesList = document.getElementById('coachesList');
            coachesList.innerHTML = '';

            coaches.forEach(coach => {
                const coachCard = document.createElement('div');
                coachCard.className = 'coach-card';

                const workoutType = coach.workouts.length > 0 ? coach.workouts[0].exercise_type : 'Тип тренировки не указан';

                coachCard.innerHTML = `
                    <img src="${coach.photo ? staticUrl + coach.photo : ''}" alt="${coach.name}" class="coach-photo">
                    <h2 class="coach-name">${coach.name}</h2>
                    <p class="coach-workout-type">${workoutType}</p>
                    <p class="coach-description">${coach.description || 'Описание отсутствует'}</p>
                    <form class="booking-form" onsubmit="bookPersonalTraining(event)">
                        <input type="hidden" name="coach_id" value="${coach.id}">
                        <label for="date">Дата:</label>
                        <input type="date" name="date" required>
                        <label for="time">Время:</label>
                        <input type="time" name="time" required>
                        <button type="submit">Записаться</button>
                    </form>
                `;

                coachesList.appendChild(coachCard);
            });
        }
        document.addEventListener('DOMContentLoaded', fetchCoaches);

        async function bookPersonalTraining(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);
            const data = {
                coach_id: formData.get('coach_id'),
                date: formData.get('date'),
                time: formData.get('time')
            };

            try {
                const response = await fetch('/api/personal_trainings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('Ошибка при бронировании тренировки');
                }

                const result = await response.json();
                alert(result.message);
                form.reset();
            } catch (error) {
                alert(error.message);
            }
        }
    </script>
</body>
{% endblock %}
